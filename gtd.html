<!DOCTYPE html>
<html lang="en">
    
    <head>
        <title>Getting things done</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="gtd.css">
        <script src="gtd.js" defer></script>
    </head>

    <body>
        <div class="top_box">
            <h1>Getting things done</h1>
            <div class="top_inbox">
                <a href="index.html">Liigu tagasi</a>
            </div>
        </div>
        <div class="itembox">
                    
            <div class="itembox_inner">
                <textarea type="text" id="text_main" class="textbox" placeholder="Sisesta tegevus"></textarea>
                <button id="edit" class="edit_button" onclick="edit()" hidden>Muuda</button>
                <button id="remove" class="edit_button" onclick="del()" hidden>Eemalda nimekirjast</button>
            </div>
        </div>

        <div class="a_container">
            <div id="list_in_block" class="a_box">
                <div class="l_topbox">
                    <h3>In</h3>
                    <button id="in_add" class="add_button" onclick="add('in')" hidden>v</button>
                </div>
                <ul id="list_in">

                </ul>
            </div>

            <div id="next" class="a_box">
                <div class="l_topbox">
                    <h3>Kohesed tegevused</h3>
                    <button id="next_add" class="add_button" onclick="add('next')" hidden>v</button>
                </div>
                <ul id="list_next">
                    
                </ul>
            </div>
            <div id="waiting" class="a_box">
                <div class="l_topbox">
                    <h3>Ootel</h3>
                    <button id="waiting_add" class="add_button" onclick="add('waiting')" hidden>v</button>
                </div>
                <ul id="list_waiting">
                    
                </ul>
            </div>
            <div id="project" class="a_box">
                <div class="l_topbox">
                    <h3>Projektid/kunagi hiljem</h3>
                    <button id="project_add" class="add_button" onclick="add('project')" hidden>v</button>
                </div>
                <ul id="list_project">
                    
                </ul>
            </div>
        </div>

    </body>

</html>
